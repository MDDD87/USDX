name: Build

on:
  push:
    branches:
      - master
  pull_request:
  # allows starting a build by hand (Actions -> Build -> Run workflow)
  workflow_dispatch:
# Fork MDDD87/USDX: no daily scheduled build and only the Windows portable
# version is built (the macOS/Linux builds and the installer are not needed
# for testing and cost a lot of build time).
jobs:
  build_windows:
    name: Build for Windows
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      FPC_VERSION: 3.2.2
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Determine version
        run: |
          $VNAME=$(cat VERSION | sed "s/+dev$/+dev-$(git rev-parse --short HEAD)/")
          echo "versionName=$VNAME" >> $env:GITHUB_ENV
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-autotools
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-git
            mingw-w64-ucrt-x86_64-ntldd
            mingw-w64-ucrt-x86_64-nasm
            patch
            unzip
      # the Free Pascal installation is cached, so it is only downloaded from
      # SourceForge once (a slow or broken download made a build hang for hours)
      - name: Cache Free Pascal
        id: cache-fpc
        uses: actions/cache@v6
        with:
          path: C:\FPC
          key: fpc-${{ env.FPC_VERSION }}-win32-win64
      - name: Install Dependencies
        if: steps.cache-fpc.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: |
          curl.exe -L --fail --retry 5 --retry-delay 10 --max-time 900 -o fpc-installer.exe "https://sourceforge.net/projects/freepascal/files/Win32/3.2.2/fpc-3.2.2.win32.and.win64.exe/download"
          $size = (Get-Item fpc-installer.exe).Length
          Write-Host "fpc-installer.exe: $size bytes"
          if ($size -lt 20000000) { throw "FPC download incomplete ($size bytes)" }
          Start-Process -FilePath ".\\fpc-installer.exe" -ArgumentList "/TYPE=full /VERYSILENT /SP- /SUPPRESSMSGBOXES /NORESTART" -Wait
      - name: Cache DLLs
        id: cache-dlls
        uses: actions/cache@v6
        with:
          path: dists/windows/prefix
          key: windows-dlls-${{ hashFiles('dists/windows/tasks.sh') }}
      - name: Build DLLs
        if: steps.cache-dlls.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: make -C dists/windows
      - name: Install DLLs
        shell: msys2 {0}
        run: |
          touch -d @0 dists/windows/tasks.sh
          make -C dists/windows install
      - name: Build
        shell: msys2 {0}
        run: |
          export PATH="$PATH:/c/FPC/$FPC_VERSION/bin/i386-win32"
          export FPCCFG="/c/FPC/$FPC_VERSION/bin/i386-win32/fpc.cfg"
          export FPCDIR="/c/FPC/$FPC_VERSION"
          export FPCMAKE="/c/FPC/$FPC_VERSION/bin/i386-win32/fpcmake"
          ./autogen.sh
          ./configure --with-opencv --with-libprojectM
          make
      - name: Remove debug files
        run: |
          del game\*.debug
      - name: Upload Portable Artifact
        uses: actions/upload-artifact@v6
        with:
          name: UltraStarDeluxe-windows-portable-${{ env.versionName }}
          path: game
          if-no-files-found: error
